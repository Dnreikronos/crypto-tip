run:
  deadline: 5m
  tests: true


version: "1.54.2"

issues:
  exclude-dirs:
    - vendor/

linters:
  enable:
    - revive
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - unconvert
    - misspell
    - prealloc
    - gosec
  disable:
    - golint

linters-settings:
  errcheck:
    check-type-assertions: true
  gofmt:
    simplify: true
  gosec:
    excludes:
      - G104
  revive:
    severity: warning
