run:
  deadline: 5m
  tests: true
  skip-dirs:
    - vendor/

linters:
  enable:
    - revive
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - unconvert
    - misspell
    - prealloc
    - gosec
  disable:
    - golint
    - goanalysis_metalinter

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec

linters-settings:
  errcheck:
    check-type-assertions: true
  govet:
    check-shadowing: true
  gofmt:
    simplify: true
  gosec:
    excludes:
      - G104
  revive:
    severity: warning

